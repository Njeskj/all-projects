apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: matching-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://host.docker.internal:9418/matching-platform
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: matching
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
