apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-service-config
  namespace: booking
data:
  REDIS_ADDR: redis.booking.svc.cluster.local:6379
  KAFKA_BROKERS: kafka.booking.svc.cluster.local:9092
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-service-secret
  namespace: booking
type: Opaque
stringData:
  # ponytail: plaintext dev creds in-repo for a local kind cluster; replace
  # with a real secret manager / sealed-secrets before any shared environment.
  DATABASE_URL: "postgres://postgres:postgres@postgres.booking.svc.cluster.local:5432/inventory?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: booking
  labels:
    app: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: localhost:5001/inventory-service:fb431cd
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: grpc
          envFrom:
            - configMapRef:
                name: inventory-service-config
            - secretRef:
                name: inventory-service-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: booking
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 9090
