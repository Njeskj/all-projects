syntax = "proto3";

package metrics;

option go_package = "metrics-collector/proto";
option java_package = "com.observability.metricscollector.grpc";
option java_multiple_files = true;

service MetricsCollectorService {
  rpc IngestMetric(IngestMetricRequest) returns (IngestMetricResponse);
}

message IngestMetricRequest {
  string metric_name = 1;
  double value = 2;
  string source = 3;
}

message IngestMetricResponse {
  bool accepted = 1;
  string id = 2;
}
