services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matching
    ports:
      - "54323:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "54321:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "54322:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "localhost:9092"]
      interval: 2s
      timeout: 3s
      retries: 30

  matching-engine:
    build:
      context: ./matching-engine
    environment:
      HTTP_PORT: "8091"
      GRPC_PORT: "9095"
      REDIS_ADDR: "redis:6379"
      KAFKA_ADDR: "kafka:9092"
    ports:
      - "8091:8091"
      - "9095:9095"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/matching"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      MATCHING_ENGINE_HOST: "matching-engine"
      MATCHING_ENGINE_GRPC_PORT: "9095"
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      matching-engine:
        condition: service_started
