apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: localhost:5001/matching-engine:3a4b75d
          ports:
            - containerPort: 8091
            - containerPort: 9095
          envFrom:
            - configMapRef:
                name: matching-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine
spec:
  selector:
    app: matching-engine
  ports:
    - name: http
      port: 8091
      targetPort: 8091
    - name: grpc
      port: 9095
      targetPort: 9095
