server:
  port: 18081

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:55432/payment
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: payment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

inventory:
  grpc:
    host: localhost
    port: 9090
